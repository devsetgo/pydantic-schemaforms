# Theme
theme:
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - navigation.top
    - search.suggest
    - content.tabs.link
    - content.code.copy
  name: 'material'
  # Use compact icon in top nav; full hero logo remains on the intro page content.
  logo: 'favicon.png'
  favicon: 'favicon.png'
  palette:
    # Toggle dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    # Toggle light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  language: en
plugins:
  - search:
      separator: '[\s\-\.]+'
      lang:
        - en
  - mike:
      # Version management configuration
      alias_type: redirect
      redirect_template: null
      deploy_prefix: ''
      canonical_version: null
      version_selector: true
      css_dir: css
      javascript_dir: js

# Extensions
markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.snippets:
      check_paths: true
      base_path: .
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
extra_javascript:
  - js/demo-link.js

extra:
  version:
    provider: mike
  social:
    - icon: material/web
      link: https://pydantic-schemaforms.devsetgo.com/
      name: Live Demo
    - icon: fontawesome/brands/github-alt
      link: https://github.com/devsetgo
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/_devsetgo
