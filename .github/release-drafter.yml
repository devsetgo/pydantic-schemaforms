# Configuration for release-drafter/release-drafter
# This file must live in the default branch at: .github/release-drafter.yml

# This repo uses CalVer-style tags (e.g. 25.12.2.beta).
# Release Drafter's $RESOLVED_VERSION is SemVer-oriented and will fall back to v0.1.0
# when it can't infer a SemVer version from tags.
#
# We keep the draft title/tag generic; the actual release tag should be chosen when
# publishing the GitHub Release.
name-template: "Release Notes (Draft)"

autolabeler:
  - label: 'breaking'
    branch:
      - '/^breaking[/-].+/'
  - label: 'feature'
    branch:
      - '/^feat(ure)?[/-].+/'
  - label: 'enhancement'
    branch:
      - '/^enhance[/-].+/'
      - '/^improvement[/-].+/'
  - label: 'bug'
    branch:
      - '/^(fix|bugfix|hotfix)[/-].+/'
  - label: 'docs'
    branch:
      - '/^docs?[/-].+/'
  - label: 'code improvements'
    branch:
      - '/^(refactor|optimize|perf|performance)[/-].+/'
  - label: 'github actions'
    branch:
      - '/^(ci|actions?|workflow)[/-].+/'
  - label: 'chore'
    branch:
      - '/^(chore|test|cleanup)[/-].+/'
  - label: 'dependencies'
    branch:
      - '/^(dep|deps|bump|dependabot)[/-].+/'

categories:
  - title: "Breaking Changes"
    labels:
      - "breaking"
  - title: "Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "Bug Fixes"
    labels:
      - "bug"
      - "fix"
  - title: "Documentation"
    labels:
      - "docs"
  - title: "Code Improvements"
    labels:
      - "code improvements"
  - title: "GitHub Actions"
    labels:
      - "github actions"
  - title: "Maintenance"
    labels:
      - "chore"
      - "dependencies"

change-template: "- $TITLE (#$NUMBER) (@$AUTHOR)"
change-title-escapes: "<*_&"

template: |
  ## Changes
  $CHANGES

  ## Contributors
  $CONTRIBUTORS
