name: Autofill PR title and description

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

jobs:
  openai-pr-title-and-description:
    runs-on: ubuntu-22.04

    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Generate and set PR title
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not set, skipping title generation."
            exit 0
          fi

          COMMITS=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json commits \
            --jq '[.commits[].messageHeadline] | join("\n")' \
            | head -20)

          TITLE=$(curl -fsSL https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"gpt-4.1-2025-04-14\",
              \"messages\": [{
                \"role\": \"system\",
                \"content\": \"You generate concise, descriptive pull request titles. Respond with only the title — no quotes, no punctuation at the end, no prefix like 'PR:'.\"
              }, {
                \"role\": \"user\",
                \"content\": \"Write a pull request title (under 72 characters) that summarises these commits:\n${COMMITS}\"
              }],
              \"max_tokens\": 60,
              \"temperature\": 0.3
            }" | jq -r '.choices[0].message.content // empty' | head -1)

          if [ -n "$TITLE" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --title "$TITLE"
          fi

      - name: Generate PR description
        continue-on-error: true
        uses: platisd/openai-pr-description@master
        with:
          github_token: ${{ github.token }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          max_tokens: 4096
          openai_model: gpt-4.1-2025-04-14
          overwrite_description: true
          temperature: 0.6
