<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Pydantic Forms Demo</title>

    <!-- Served from /vendor/* (see fastapi_routes.py's vendor_bootstrap_css/js
         routes), not a CDN -- a render-blocking cdn.jsdelivr.net <link> here
         used to add several seconds per page load whenever the CDN was slow
         to reach (e.g. a devcontainer's forwarded browser). -->
    <link href="/vendor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/bootstrap-icons.css" />
    <!-- <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"> -->
    <link rel="icon" type="image/png" href="{{ url_for('static', path='favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='favicon.png') }}">
    <script defer data-domain="pydantic-schemaforms.devsetgo.com" src="https://plausible.devsetgo.com/js/script.js"></script>

    {% block extra_head %}{% endblock %}

    <style>
        :root {
            --demo-primary-color: #4f46e5;
            --demo-secondary-color: #7c3aed;
        }

        body {
            background-color: #f8f9fa;
        }

        /* Bootstrap's default primary, info and code colors fall below the
           WCAG AA 4.5:1 text contrast on this page's light-gray surfaces
           (tests/playwright/test_accessibility.py). */
        :root {
            --bs-link-color: #0a58ca;
            --bs-link-color-rgb: 10, 88, 202;
            --bs-code-color: #a61e4d;
        }

        .btn-outline-primary {
            --bs-btn-color: #0a58ca;
            --bs-btn-border-color: #0a58ca;
            --bs-btn-hover-bg: #0a58ca;
            --bs-btn-hover-border-color: #0a58ca;
            --bs-btn-active-bg: #0a58ca;
        }

        .btn-outline-info {
            --bs-btn-color: #087990;
            --bs-btn-border-color: #087990;
            --bs-btn-hover-color: #ffffff;
            --bs-btn-hover-bg: #087990;
            --bs-btn-hover-border-color: #087990;
            --bs-btn-active-color: #ffffff;
            --bs-btn-active-bg: #087990;
        }










        .demo-card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 0.75rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .form-header,
        .hero-section {
            background: linear-gradient(135deg, var(--demo-primary-color), var(--demo-secondary-color));
            color: #fff;
            padding: 1.5rem;
            border-radius: 0.75rem 0.75rem 0 0;
        }

        .btn-demo {
            background-color: var(--demo-primary-color);
            border-color: var(--demo-primary-color);
            color: #fff;
        }

        .btn-demo:hover {
            background-color: #4338ca;
            border-color: #4338ca;
            color: #fff;
        }






        .demo-version-footer {
            margin-top: 2rem;
            padding-top: 0.9rem;
            border-top: 1px solid #e5e7eb;
            font-size: 0.78rem;
            color: #6b7280;
            text-align: center;
        }

        /* Bootstrap's data-bs-theme="dark" recolors its own components; these are
           the demo's own light values. */
        :root { --demo-code-bg: #f1f3f5; }

        [data-bs-theme="dark"] {
            --demo-code-bg: #2b3035;
            --bs-link-color: #6ea8fe;
            --bs-link-color-rgb: 110, 168, 254;
            --bs-code-color: #e685b5;
        }

        [data-bs-theme="dark"] body { background-color: #1a1d20; }
        [data-bs-theme="dark"] .demo-card { background: var(--bs-body-bg); border-color: var(--bs-border-color); }
        [data-bs-theme="dark"] .demo-version-footer { border-top-color: var(--bs-border-color); color: var(--bs-secondary-color); }
        [data-bs-theme="dark"] .bg-light, [data-bs-theme="dark"] .bg-white {
            background-color: var(--bs-tertiary-bg) !important;
            color: var(--bs-body-color);
        }
        [data-bs-theme="dark"] .btn-outline-primary {
            --bs-btn-color: #6ea8fe;
            --bs-btn-border-color: #6ea8fe;
            --bs-btn-hover-bg: #6ea8fe;
            --bs-btn-hover-color: #000;
            --bs-btn-hover-border-color: #6ea8fe;
            --bs-btn-active-bg: #6ea8fe;
            --bs-btn-active-color: #000;
        }
        [data-bs-theme="dark"] .text-muted { color: #ced4da !important; }
        [data-bs-theme="dark"] .btn-outline-secondary {
            --bs-btn-color: #ced4da;
            --bs-btn-border-color: #ced4da;
            --bs-btn-hover-bg: #ced4da;
            --bs-btn-hover-color: #000;
            --bs-btn-hover-border-color: #ced4da;
            --bs-btn-active-bg: #ced4da;
            --bs-btn-active-color: #000;
        }
        [data-bs-theme="dark"] .btn-outline-dark {
            --bs-btn-color: #dee2e6;
            --bs-btn-border-color: #dee2e6;
            --bs-btn-hover-bg: #dee2e6;
            --bs-btn-hover-color: #000;
            --bs-btn-hover-border-color: #dee2e6;
            --bs-btn-active-bg: #dee2e6;
            --bs-btn-active-color: #000;
        }
        [data-bs-theme="dark"] .btn-outline-success {
            --bs-btn-color: #75b798;
            --bs-btn-border-color: #75b798;
            --bs-btn-hover-bg: #75b798;
            --bs-btn-hover-color: #000;
            --bs-btn-hover-border-color: #75b798;
            --bs-btn-active-bg: #75b798;
            --bs-btn-active-color: #000;
        }
        [data-bs-theme="dark"] .btn-outline-info {
            --bs-btn-color: #6edff6;
            --bs-btn-border-color: #6edff6;
            --bs-btn-hover-bg: #6edff6;
            --bs-btn-hover-color: #000;
            --bs-btn-hover-border-color: #6edff6;
            --bs-btn-active-bg: #6edff6;
            --bs-btn-active-color: #000;
        }
    </style>

    {% block extra_styles %}{% endblock %}
</head>

<body>
    {% include "_site_bar.html" %}

    <div class="{% if request and 'organization' in request.path %}container-fluid{% else %}container{% endif %} py-4">
        {% block content %}{% endblock %}
        <div class="demo-version-footer">
            Demo App: v{{ container_version }}
        </div>
    </div>

    <script src="/vendor/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
