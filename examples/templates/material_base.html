<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Pydantic Forms Demo</title>
    <!-- The Material page shell: no Bootstrap, no icon font. Tokens come from the library. -->
    <link rel="stylesheet" href="/vendor/md3-tokens.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='favicon.png') }}">
    {% block extra_head %}{% endblock %}
    <style>
        body.md-shell {
            margin: 0;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-family: var(--md-sys-typescale-font);
            font-size: 16px;
            line-height: 24px;
        }

        /* The demo's own colors, so the page isn't all one hue. The form keeps the MD3 scheme. */
        .md-shell {
            --demo-link: light-dark(#00639b, #8ed0ff);
            --demo-warning-bg: light-dark(#ffefc2, #4d3a00);
            --demo-warning-fg: light-dark(#3f2e00, #ffdf9e);
            --demo-info-bg: light-dark(#d3e9f5, #004d65);
            --demo-info-fg: light-dark(#001e2c, #c1e8fb);
            --demo-success-bg: light-dark(#c8f0d0, #0f5223);
            --demo-success-fg: light-dark(#00210b, #a6f2b5);
        }

        .md-shell a { color: var(--demo-link); }
        .md-shell code { font-family: var(--md-sys-typescale-mono); font-size: 14px; }

        .md-shell__main {
            max-width: 840px;
            margin: 0 auto;
            padding: 24px;
        }

        /* The page templates are shared with the Bootstrap shell; these are the
           few of their class names that carry meaning. */
        .md-shell .bi, .md-shell .btn-group + .bi { display: none; }
        .md-shell .form-header h2 { margin: 0 0 8px; font-size: 28px; font-weight: 400; line-height: 36px; }
        .md-shell .form-header {
            margin-bottom: 24px;
            padding: 24px;
            border-radius: var(--md-sys-shape-corner-large);
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #ffffff;
        }
        .md-shell .row { display: flex; flex-wrap: wrap; gap: 16px; }
        .md-shell .row > * { flex: 1 1 240px; min-width: 0; }
        .md-shell .row.justify-content-center > * { flex-basis: 100%; }
        .md-shell .mt-4 { margin-top: 24px; }
        .md-shell .p-3 { padding: 16px; }
        .md-shell .mb-2, .md-shell .mb-3 { margin-bottom: 8px; }
        .md-shell .text-center { text-align: center; }
        .md-shell .text-start { text-align: start; }
        .md-shell .d-flex { display: flex; }
        .md-shell .flex-wrap { flex-wrap: wrap; }
        .md-shell .align-items-center { align-items: center; }
        .md-shell .gap-2 { gap: 8px; }
        .md-shell .me-2 { margin-inline-end: 8px; }
        .md-shell .mb-4 { margin-bottom: 24px; }
        .md-shell pre { margin: 0; overflow-x: auto; text-align: start; }
        .md-shell .small { font-size: 14px; line-height: 20px; }
        .md-shell .text-muted { color: var(--md-sys-color-on-surface-variant); }
        .md-shell .text-danger { color: var(--md-sys-color-error); }
        .md-shell .bg-light {
            border-radius: var(--md-sys-shape-corner-medium);
            background: var(--md-sys-color-surface-container-low);
        }
        .md-shell .alert {
            margin-bottom: 16px;
            padding: 16px;
            border-radius: var(--md-sys-shape-corner-medium);
            background: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }
        .md-shell .alert-warning { background: var(--demo-warning-bg); color: var(--demo-warning-fg); }
        .md-shell .alert-success { background: var(--demo-success-bg); color: var(--demo-success-fg); }
        .md-shell .alert-info { background: var(--demo-info-bg); color: var(--demo-info-fg); }
        .md-shell .bg-info {
            border-radius: var(--md-sys-shape-corner-medium);
            background: var(--demo-info-bg);
            color: var(--demo-info-fg);
        }
        .md-shell .bg-info .text-muted { color: inherit; }
        .md-shell .alert pre, .md-shell .bg-info code { color: inherit; }
        .md-shell .badge {
            display: inline-block;
            padding: 0 8px;
            border-radius: var(--md-sys-shape-corner-full);
            background: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            font-size: 12px;
            line-height: 20px;
        }
        .md-shell .form-header .badge { background: #ffffff; color: #3730a3; }
        .md-shell .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .md-shell .btn {
            display: inline-block;
            min-height: 40px;
            padding: 0 16px;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: var(--md-sys-shape-corner-full);
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            line-height: 38px;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        .md-shell .form-label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
        .md-shell .form-control {
            display: block;
            width: 100%;
            min-height: 56px;
            padding: 8px 16px;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: var(--md-sys-shape-corner-extra-small);
            background-color: transparent;
            color: var(--md-sys-color-on-surface);
            font: inherit;
            box-sizing: border-box;
        }
        .md-shell .demo-version-footer {
            margin-top: 24px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12px;
            text-align: center;
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>

<body class="md-form md-shell">
    {% include "_site_bar.html" %}
    <main class="md-shell__main">
        {% block content %}{% endblock %}
        <div class="demo-version-footer">Demo App: v{{ container_version }}</div>
    </main>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
