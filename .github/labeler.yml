# A path label means the PR changes only those paths. With any-glob-to-any-file,
# every feature PR that also touched docs or tests was listed under Features,
# Documentation and Maintenance in Release Drafter's notes.
docs:
  - changed-files:
      - all-globs-to-all-files:
          - 'docs/**'
          - 'examples/**'
          - 'mkdocs.yml'
          - '*.md'
          - 'CONTRIBUTING.md'
          - 'CHANGELOG.md'

dependencies:
  - changed-files:
      - all-globs-to-all-files:
          - 'requirements*.txt'
          - 'pyproject.toml'

github actions:
  - changed-files:
      - all-globs-to-all-files:
          - '.github/workflows/**'

chore:
  - changed-files:
      - all-globs-to-all-files:
          - '.github/dependabot.yml'
          - '.github/release-drafter.yml'
          - '.github/labeler.yml'
          - 'tests/**'
          - 'scripts/**'
          - 'makefile'
          - 'sonar-project.properties'
          - '.pre-commit-config.yaml'
