name: Deploy Documentation

on:
  # Manual/direct trigger -- prefer this over calling this workflow with
  # `uses:` from another workflow's job. A job with `environment:` invoked
  # via workflow_call can't reliably resolve its real triggering tag for
  # environment protection rules and gets rejected under a synthetic
  # "untagged-<hash>" ref instead (see repo history around commit a6feed2,
  # which introduced this by switching FROM workflow_dispatch TO
  # workflow_call). workflow_dispatch runs against a real branch/tag ref
  # that deployment protection rules can actually match.
  workflow_dispatch:
    inputs:
      version:
        description: "Docs version label for mike (e.g. 26.1.2b1)"
        required: true
        type: string
      checkout_ref:
        description: "Git ref to build docs from (tag/sha/branch). Defaults to the version string as a tag name."
        required: false
        default: ""
        type: string
      aliases:
        description: "Space-separated aliases (e.g. 'latest stable')"
        required: false
        default: "latest stable"
        type: string
  workflow_call:
    inputs:
      version:
        description: "Docs version label for mike (e.g. 26.1.2b1)"
        required: true
        type: string
      checkout_ref:
        description: "Git ref to build docs from (tag/sha/branch). For releases, pass the tag name."
        required: true
        type: string
      aliases:
        description: "Space-separated aliases (e.g. 'latest stable')"
        required: false
        default: "latest stable"
        type: string

jobs:
  deploy-docs:
    name: Deploy versioned documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Resolve checkout ref
        id: resolve
        run: |
          checkout_ref="${{ inputs.checkout_ref }}"
          if [ -z "$checkout_ref" ]; then
            checkout_ref="${{ inputs.version }}"
            echo "No checkout_ref given; defaulting to version tag '$checkout_ref'"
          fi
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout repository (build from requested ref)
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mike

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages branch (avoid non-fast-forward)
        run: |
          git fetch origin gh-pages:gh-pages || true

      - name: Prepare documentation files
        run: |
          python3 scripts/update_docs.py
          python3 scripts/changelog.py
          cp README.md docs/index.md
          cp CONTRIBUTING.md docs/contribute.md
          cp CHANGELOG.md docs/release-notes.md

      - name: Deploy documentation with mike
        run: |
          VERSION="${{ inputs.version }}"
          DOCS_BRANCH="gh-pages"

          if [ -z "$VERSION" ] || echo "$VERSION" | grep -q '^refs/'; then
            echo "Error: Invalid version detected: '$VERSION'"
            exit 1
          fi

          # Convert aliases to args: "latest stable" => --aliases latest stable
          ALIASES="${{ inputs.aliases }}"

          python3 scripts/deploy_docs.py deploy \
            --version "$VERSION" \
            --aliases $ALIASES \
            --title "Release $VERSION" \
            --branch "$DOCS_BRANCH" \
            --ignore-remote-status \
            --push

          mike set-default stable --branch "$DOCS_BRANCH" --push

      - name: Clean working tree before gh-pages checkout
        run: |
          git reset --hard
          git clean -fd

      - name: Checkout gh-pages branch content
        run: |
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
