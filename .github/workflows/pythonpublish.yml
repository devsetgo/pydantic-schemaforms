name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build --sdist --wheel

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  release-highlights:
    name: Add CHANGELOG highlights to the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Update the release body
        run: |
          gh release view "$TAG" --json body --jq .body > current-body.md
          python3 scripts/changelog.py --release-body "$TAG" current-body.md > new-body.md
          gh release edit "$TAG" --notes-file new-body.md

  prepare-docs-inputs:
    name: Prepare docs deployment inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.docs-inputs.outputs.version }}
      checkout_ref: ${{ steps.docs-inputs.outputs.checkout_ref }}
      aliases: ${{ steps.docs-inputs.outputs.aliases }}
    steps:
      - name: Compute docs inputs from release tag
        id: docs-inputs
        run: |
          raw_tag="${{ github.event.release.tag_name }}"
          if [ -z "$raw_tag" ]; then
            echo "Missing release.tag_name; cannot continue."
            exit 1
          fi

          version="${raw_tag#v}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$raw_tag" >> "$GITHUB_OUTPUT"
          echo "aliases=latest stable" >> "$GITHUB_OUTPUT"

  deploy-docs:
    name: Deploy documentation after PyPI publish
    needs:
      - deploy
      - prepare-docs-inputs
    uses: ./.github/workflows/deploy-docs.yml
    with:
      version: ${{ needs.prepare-docs-inputs.outputs.version }}
      checkout_ref: ${{ needs.prepare-docs-inputs.outputs.checkout_ref }}
      aliases: ${{ needs.prepare-docs-inputs.outputs.aliases }}
    permissions:
      contents: write
      pages: write
      id-token: write
