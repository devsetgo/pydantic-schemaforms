name: Testing

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff==0.15.13

      - name: Check formatting
        run: ruff format --check pydantic_schemaforms tests

      - name: Check lint
        run: ruff check pydantic_schemaforms tests

  type-check:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run pyright
        run: pyright

      - name: Verify exported types (py.typed)
        run: pyright --verifytypes pydantic_schemaforms --ignoreexternal
        continue-on-error: true  # Pydantic metaclass makes type[FormModel] partially unknown; tracked separately

  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test with pytest
        run: pytest -n 2 --ignore=tests/playwright --cov-fail-under=90

  playwright:
    name: Playwright (HTMX live validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Run Playwright tests
        run: pytest tests/playwright/ -v --no-cov -p no:xdist

      - name: Upload Material screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: material-screenshots
          path: tests/playwright/screenshots/
          if-no-files-found: ignore

  library-skills:
    # The Agent Skills in pydantic_schemaforms/.agents/skills/ must survive the
    # wheel build and be found by the real library-skills CLI (#264).
    name: Agent skills install from the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build the wheel
        run: pip wheel --no-deps -w dist .

      - name: Install the skills into a scratch project
        run: |
          mkdir -p /tmp/app/.claude && cd /tmp/app
          printf '[project]\nname = "app"\nversion = "0"\ndependencies = ["pydantic-schemaforms"]\n' > pyproject.toml
          python -m venv .venv
          .venv/bin/pip install --no-deps "$GITHUB_WORKSPACE"/dist/pydantic_schemaforms-*.whl
          .venv/bin/pip install library-skills==0.0.19
          .venv/bin/python -m library_skills --claude --all --yes --no-tool-skill

      - name: Check every skill is installed
        run: |
          cd /tmp/app
          for skill in pydantic-schemaforms schemaforms-create schemaforms-convert schemaforms-upgrade schemaforms-document; do
            test -f ".claude/skills/$skill/SKILL.md" || { echo "missing $skill"; exit 1; }
          done
          .venv/bin/python -m library_skills --claude --check

  docs-zensical:
    # Early warning for the planned move off MkDocs Material (#147): builds the
    # docs with Zensical, which reads mkdocs.yml as-is. Not required to pass;
    # the published docs still build with MkDocs.
    name: Docs build (Zensical, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Zensical
        run: pip install zensical==0.0.73

      - name: Prepare documentation files
        run: |
          cp README.md docs/index.md
          cp CONTRIBUTING.md docs/contribute.md
          cp CHANGELOG.md docs/release-notes.md

      - name: Build docs with Zensical
        run: zensical build
