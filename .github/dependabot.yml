# Basic dependabot.yml file with
# minimum configuration for two package managers

version: 2
updates:
  # Enable version updates for pip
  - package-ecosystem: "pip"
    # Look for `requirements`in directory
    directory: "/"
    # Check the pypi for updates
    labels:
      - "pip"
      - "dependencies"
    commit-message:
      # Prefix all commit messages with "pip"
      prefix: "pip"
      include: "scope"
    schedule:
      interval: "cron"
      # Run on the 1st Saturday of each month at 04:00
      cronjob: "0 4 1-7 * 6"
      timezone: "America/New_York"
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "github actions"
      - "dependencies"
    commit-message:
      # Prefix all commit messages with "github-actions"
      prefix: "github-actions"
      include: "scope"
    schedule:
      interval: "cron"
      # Run on the 1st Saturday of each month at 04:00
      cronjob: "0 4 1-7 * 6"
      timezone: "America/New_York"
