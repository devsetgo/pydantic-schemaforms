name: Demo Docker Image

# Builds the demo app image (demo_app/Dockerfile), which installs
# pydantic-schemaforms from PyPI, so it runs after the package is published.
# pythonpublish.yml calls it once the docs have deployed; run it by hand to
# rebuild the image, for example after a fix to the demo app.
#
# Like `make docker-build`, the image is tagged with its build time
# (YY.MM.DD.HHMM, New York time), not the library version: a fixed demo can be
# released without a new PyPI version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Library version to install (e.g. 26.4.6); must already be on PyPI"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Library version to install; must already be on PyPI"
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

env:
  IMAGE: mikeryan56/pydantic-schemaforms-demo

jobs:
  docker-image:
    name: Build, test and push the demo image
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.beta)?$'; then
            echo "Error: '$VERSION' is not a version like 26.4.6"
            exit 1
          fi

      # A release builds the demo from its tag; a manual run builds from the
      # branch picked in the Run workflow dialog, so a demo fix on main ships.
      - name: Checkout the code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || inputs.version }}

      - name: Wait for the version on PyPI
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # A new release can take a few minutes to reach PyPI's index.
          for attempt in $(seq 1 20); do
            if pip download --no-deps --quiet --dest /tmp/pypi-check "pydantic-schemaforms==$VERSION"; then
              echo "pydantic-schemaforms $VERSION is on PyPI"
              exit 0
            fi
            echo "Not on PyPI yet (attempt $attempt of 20); waiting 30s"
            sleep 30
          done
          echo "Error: pydantic-schemaforms $VERSION never appeared on PyPI"
          exit 1

      - name: Pin the demo's requirements to this version
        env:
          VERSION: ${{ inputs.version }}
        run: sed "s/__APP_VERSION__/$VERSION/g" demo_app/requirements.template > demo_app/requirements.txt

      - name: Compute the image tag
        id: tag
        run: echo "tag=$(TZ=America/New_York date +%y.%m.%d.%H%M)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demo_app/Dockerfile
          build-args: SCHEMAFORMS_DEMO_IMAGE_VERSION=${{ steps.tag.outputs.tag }}
          labels: version=${{ steps.tag.outputs.tag }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }},${{ env.IMAGE }}:latest
          load: true

      - name: Smoke-test the image
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker run --rm "$IMAGE:$TAG" python -c "import examples.main; print('smoke-ok')"
          installed=$(docker run --rm "$IMAGE:$TAG" python -c "import pydantic_schemaforms; print(pydantic_schemaforms.__version__)")
          if [ "$installed" != "$VERSION" ]; then
            echo "Error: the image has pydantic-schemaforms $installed, expected $VERSION"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "Pushing $IMAGE:$TAG and :latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
