name: Sync examples to demo repo

on:
  push:
    branches: [main]
    paths:
      - 'examples/shared_models.py'
      - 'examples/nested_forms_example.py'
      - 'examples/templates/form.html'
      - 'examples/templates/home.html'
      - 'examples/templates/success.html'
      - 'examples/templates/shared_base.html'
      - 'examples/templates/404.html'
      - 'examples/templates/500.html'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sync event to demo repo
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.DEMO_REPO_TOKEN }}
          script: |
            const sha = context.sha;
            const message = context.payload.head_commit?.message ?? '';

            await github.rest.repos.createDispatchEvent({
              owner: 'devsetgo',
              repo: 'pydantic-schemaforms-demo',
              event_type: 'library-sync',
              client_payload: { sha, message },
            });

            core.info(`Dispatched library-sync to pydantic-schemaforms-demo @ ${sha}`);
