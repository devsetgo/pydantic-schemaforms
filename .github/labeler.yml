docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'examples/**'
          - 'mkdocs.yml'
          - '*.md'
          - 'CONTRIBUTING.md'
          - 'CHANGELOG.md'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'requirements*.txt'
          - 'pyproject.toml'

github actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'

chore:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/dependabot.yml'
          - '.github/release-drafter.yml'
          - '.github/labeler.yml'
          - 'tests/**'
          - 'scripts/**'
          - 'makefile'
          - 'sonar-project.properties'
          - '.pre-commit-config.yaml'
